<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Prompt-Pack-holder</title>
<style>
:root{--w:#FFF;--g:#E6E6E6;--a:#2F2F2F;--b:#C4A882;--l:rgba(47,47,47,.08);--s:rgba(196,168,130,.2)}
*{box-sizing:border-box}html,body{margin:0;background:var(--g);color:var(--a);font-family:Inter,system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{max-width:1100px;margin:0 auto;min-height:100vh;background:var(--w);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--l);position:sticky;top:0;background:var(--w);z-index:5}
.brand{font-weight:750}.lang{display:flex;gap:4px;flex-wrap:wrap}
.lang button{border:1px solid var(--l);background:var(--w);padding:6px 8px;border-radius:8px;min-height:44px}
.lang button.on{background:var(--s);border-color:var(--b)}
main{flex:1;padding:20px 16px 96px}h1{font-size:1.6rem;margin:0 0 8px}
.muted{color:rgba(47,47,47,.72)}.card{border:1px solid var(--l);border-radius:14px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}label{display:block;font-size:.85rem;margin:0 0 6px}
input,textarea{width:100%;border:1px solid var(--l);border-radius:10px;padding:12px}
textarea{min-height:220px;font-family:ui-monospace,Consolas,monospace;line-height:1.45}
.btn{border:0;background:var(--a);color:var(--w);border-radius:12px;padding:12px 16px;min-height:44px}
.btn.sec{background:var(--g);color:var(--a)}.err{color:#7a2e2e}.ok{color:#2b5a3a}
nav.tab{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--w);border-top:1px solid var(--l)}
nav.tab button{border:0;background:var(--w);padding:14px 8px;min-height:56px}
nav.tab button.on{box-shadow:inset 0 3px 0 var(--b);font-weight:650}
.chip{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--s);margin-right:6px;font-size:.8rem}
@media(min-width:900px){.desk{display:grid;grid-template-columns:280px 1fr;gap:20px}nav.tab{display:none}.side{border-right:1px solid var(--l);padding-right:16px}}
</style></head><body><div class="app"><header><div class="brand">Prompt-Pack-holder</div><div class="lang" id="langbar"></div></header><main id="root"></main><nav class="tab" id="tabs" hidden><button data-go="library">Library</button><button data-go="feed">Feed</button><button data-go="settings">Settings</button></nav></div>
<script>
const T={de:{welcome:"Willkommen",choose:"Sprache waehlen",register:"Registrieren",login:"Anmelden",user:"Benutzername",pin:"4-stellige PIN",pin2:"PIN bestaetigen",go:"Weiter",mismatch:"PIN stimmt nicht.",locked:"Zu viele Versuche. 60 Sekunden warten.",bad:"Anmeldung fehlgeschlagen.",library:"Meine Listen",feed:"Oeffentlich",settings:"Einstellungen",newList:"Neue Liste",save:"Speichern",editor:"Prompt schreiben",title:"Titel",body:"Prompt",tags:"Tags",publish:"Veroeffentlichen",unpublish:"Zurueckziehen",copy:"Kopieren",copied:"Kopiert.",like:"Like",comment:"Kommentieren",emptyLib:"Noch keine Listen.",emptyFeed:"Noch keine oeffentlichen Prompts.",confirmPub:"Wirklich veroeffentlichen?",del:"Loeschen",logout:"Abmelden",changePin:"PIN aendern"},en:{welcome:"Welcome",choose:"Choose language",register:"Register",login:"Log in",user:"Username",pin:"4-digit PIN",pin2:"Confirm PIN",go:"Continue",mismatch:"PINs do not match.",locked:"Too many attempts. Wait 60 seconds.",bad:"Sign-in failed.",library:"My lists",feed:"Public",settings:"Settings",newList:"New list",save:"Save",editor:"Write prompt",title:"Title",body:"Prompt",tags:"Tags",publish:"Publish",unpublish:"Unpublish",copy:"Copy",copied:"Copied.",like:"Like",comment:"Comment",emptyLib:"No lists yet.",emptyFeed:"No public prompts yet.",confirmPub:"Publish this prompt?",del:"Delete",logout:"Log out",changePin:"Change PIN"},fr:{welcome:"Bienvenue",choose:"Choisir la langue",register:"Creer un compte",login:"Connexion",user:"Nom d'utilisateur",pin:"Code a 4 chiffres",pin2:"Confirmer",go:"Continuer",mismatch:"Codes differents.",locked:"Trop d'essais.",bad:"Echec.",library:"Mes listes",feed:"Public",settings:"Reglages",newList:"Nouvelle liste",save:"Enregistrer",editor:"Ecrire un prompt",title:"Titre",body:"Prompt",tags:"Tags",publish:"Publier",unpublish:"Retirer",copy:"Copier",copied:"Copie.",like:"J'aime",comment:"Commenter",emptyLib:"Aucune liste.",emptyFeed:"Aucun prompt public.",confirmPub:"Publier?",del:"Supprimer",logout:"Sortir",changePin:"Changer le code"},it:{welcome:"Benvenuto",choose:"Scegli la lingua",register:"Registrati",login:"Accedi",user:"Nome utente",pin:"PIN a 4 cifre",pin2:"Conferma PIN",go:"Avanti",mismatch:"PIN diversi.",locked:"Troppi tentativi.",bad:"Accesso fallito.",library:"Liste",feed:"Pubblico",settings:"Impostazioni",newList:"Nuova lista",save:"Salva",editor:"Scrivi prompt",title:"Titolo",body:"Prompt",tags:"Tag",publish:"Pubblica",unpublish:"Ritira",copy:"Copia",copied:"Copiato.",like:"Mi piace",comment:"Commenta",emptyLib:"Nessuna lista.",emptyFeed:"Nessun prompt.",confirmPub:"Pubblicare?",del:"Elimina",logout:"Esci",changePin:"Cambia PIN"},ru:{welcome:"Dobro pozhalovat",choose:"Yazyk",register:"Registratsiya",login:"Vhod",user:"Username",pin:"PIN",pin2:"PIN again",go:"OK",mismatch:"PIN mismatch",locked:"Locked 60s",bad:"Failed",library:"Lists",feed:"Feed",settings:"Settings",newList:"New list",save:"Save",editor:"Write",title:"Title",body:"Prompt",tags:"Tags",publish:"Publish",unpublish:"Unpublish",copy:"Copy",copied:"Copied",like:"Like",comment:"Comment",emptyLib:"No lists",emptyFeed:"No posts",confirmPub:"Publish?",del:"Delete",logout:"Out",changePin:"PIN"}};
const LANGS=[["de","Deutsch"],["en","English"],["fr","Francais"],["it","Italiano"],["ru","Russkiy"]];
const KEY="pph.v1";
const hash=async s=>{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")};
const load=()=>JSON.parse(localStorage.getItem(KEY)||"null")||{lang:(navigator.language||"en").slice(0,2),users:{},session:null,lists:[],prompts:[],posts:[],comments:[],locks:{}};
const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
let state=load(); if(!T[state.lang]) state.lang="en";
const t=()=>T[state.lang]; const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();
const el=h=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstElementChild};
function langbar(){const bar=document.getElementById("langbar");bar.innerHTML="";LANGS.forEach(([k,l])=>{const b=document.createElement("button");b.textContent=l;b.className=state.lang===k?"on":"";b.onclick=()=>{state.lang=k;if(state.session&&state.users[state.session])state.users[state.session].ui_language=k;save();render()};bar.appendChild(b)})}
function screen(html,tab){document.getElementById("root").innerHTML=html;const nav=document.getElementById("tabs");nav.hidden=!tab||!state.session;[...nav.querySelectorAll("button")].forEach(b=>b.classList.toggle("on",b.dataset.go===tab))}
function viewWelcome(){const L=t();screen(`<h1>${L.welcome}</h1><p class="muted">${L.choose}</p><div class="card row"><button class="btn" id="reg">${L.register}</button><button class="btn sec" id="log">${L.login}</button></div>`);document.getElementById("reg").onclick=()=>viewAuth("register");document.getElementById("log").onclick=()=>viewAuth("login")}
function viewAuth(mode){const L=t();screen(`<h1>${mode==="register"?L.register:L.login}</h1><div class="card"><label>${L.user}</label><input id="u"/><label>${L.pin}</label><input id="p" inputmode="numeric" maxlength="4"/>${mode==="register"?`<label>${L.pin2}</label><input id="p2" inputmode="numeric" maxlength="4"/>`:""}<p class="err" id="e"></p><button class="btn" id="go">${L.go}</button></div>`);document.getElementById("go").onclick=async()=>{const u=document.getElementById("u").value.trim();const p=document.getElementById("p").value.trim();const e=document.getElementById("e");if(!/^[A-Za-z0-9._-]{3,24}$/.test(u)||!/^\d{4}$/.test(p)){e.textContent=L.bad;return}const lock=state.locks[u]||{n:0,until:0};if(Date.now()<lock.until){e.textContent=L.locked;return}if(mode==="register"){const p2=document.getElementById("p2").value.trim();if(p!==p2){e.textContent=L.mismatch;return}if(state.users[u]){e.textContent=L.bad;return}state.users[u]={username:u,pin_hash:await hash(u+":"+p),created_at:Date.now(),ui_language:state.lang};state.session=u;state.lists.push({id:uid(),owner:u,name:"Inbox",created_at:Date.now(),sort_order:0});save();viewLibrary();return}const user=state.users[u];const ok=user&&user.pin_hash===await hash(u+":"+p);if(!ok){lock.n++;if(lock.n>=5){lock.until=Date.now()+60000;lock.n=0}state.locks[u]=lock;save();e.textContent=lock.until>Date.now()?L.locked:L.bad;return}state.locks[u]={n:0,until:0};state.session=u;save();viewLibrary()}}
function mineLists(){return state.lists.filter(l=>l.owner===state.session)}
function minePrompts(id){return state.prompts.filter(p=>p.owner===state.session&&(!id||p.list_id===id))}
function viewLibrary(){const L=t();const lists=mineLists();screen(`<div class="desk"><div class="side"><h1>${L.library}</h1><button class="btn" id="nl">${L.newList}</button><div id="lists"></div></div><div><p class="muted">${L.emptyLib}</p></div></div>`,"library");const box=document.getElementById("lists");lists.forEach(l=>{const b=el(`<button class="card" style="text-align:left;width:100%"><strong>${l.name}</strong></button>`);b.onclick=()=>viewList(l.id);box.appendChild(b)});document.getElementById("nl").onclick=()=>{const name=prompt(L.newList);if(!name)return;state.lists.push({id:uid(),owner:state.session,name:name.trim(),created_at:Date.now(),sort_order:lists.length});save();viewLibrary()}}
function viewList(id){const L=t();const list=state.lists.find(x=>x.id===id);const items=minePrompts(id);screen(`<button class="btn sec" id="back">${L.library}</button><h1>${list.name}</h1><button class="btn" id="np">${L.editor}</button><div class="list"></div>`,"library");document.getElementById("back").onclick=viewLibrary;document.getElementById("np").onclick=()=>viewEditor(null,id);const wrap=document.querySelector(".list");items.forEach(p=>{const n=el(`<div class="card"><strong>${p.title}</strong><div class="muted">${(p.body||"").slice(0,140)}</div><button class="btn sec open">${L.go}</button></div>`);n.querySelector(".open").onclick=()=>viewPrompt(p.id);wrap.appendChild(n)})}
function viewEditor(pid,listId){const L=t();const p=pid?state.prompts.find(x=>x.id===pid):{title:"",body:"",tags:[],list_id:listId};screen(`<h1>${L.editor}</h1><label>${L.title}</label><input id="title" value="${(p.title||"").replaceAll('"','"')}"/><label>${L.body}</label><textarea id="body">${p.body||""}</textarea><label>${L.tags}</label><input id="tags" value="${(p.tags||[]).join(", ")}"/><button class="btn" id="save">${L.save}</button>`,"library");document.getElementById("save").onclick=()=>{const title=document.getElementById("title").value.trim()||"Untitled";const body=document.getElementById("body").value;const tags=document.getElementById("tags").value.split(",").map(s=>s.trim()).filter(Boolean);if(pid)Object.assign(p,{title,body,tags,updated_at:Date.now()});else state.prompts.push({id:uid(),owner:state.session,list_id:listId,title,body,tags,created_at:Date.now(),updated_at:Date.now(),is_public:false});save();viewList(pid?p.list_id:listId)}}
function viewPrompt(id){const L=t();const p=state.prompts.find(x=>x.id===id);screen(`<h1>${p.title}</h1><pre class="card" style="white-space:pre-wrap">${(p.body||"").replace(/[<>]/g,s=>({"<":"<",">":">"}[s]))}</pre><div>${(p.tags||[]).map(x=>`<span class="chip">${x}</span>`).join("")}</div><p class="ok" id="msg"></p><div class="row"><button class="btn" id="copy">${L.copy}</button><button class="btn sec" id="edit">${L.editor}</button><button class="btn sec" id="pub">${p.is_public?L.unpublish:L.publish}</button><button class="btn sec" id="del">${L.del}</button></div>`,"library");document.getElementById("copy").onclick=async()=>{await navigator.clipboard.writeText(p.body||"");document.getElementById("msg").textContent=L.copied};document.getElementById("edit").onclick=()=>viewEditor(p.id,p.list_id);document.getElementById("pub").onclick=()=>{if(!p.is_public&&!confirm(L.confirmPub))return;p.is_public=!p.is_public;if(p.is_public)state.posts.push({prompt_id:p.id,published_at:Date.now(),likes:[]});else{state.posts=state.posts.filter(x=>x.prompt_id!==p.id);state.comments=state.comments.filter(c=>c.post_id!==p.id)}save();viewPrompt(id)};document.getElementById("del").onclick=()=>{if(!confirm(L.del))return;state.prompts=state.prompts.filter(x=>x.id!==p.id);state.posts=state.posts.filter(x=>x.prompt_id!==p.id);state.comments=state.comments.filter(c=>c.post_id!==p.id);save();viewList(p.list_id)}}
function viewFeed(){const L=t();const posts=state.posts.slice().sort((a,b)=>b.published_at-a.published_at);screen(`<h1>${L.feed}</h1>${posts.length?"":`<p class="muted">${L.emptyFeed}</p>`}<div id="feed"></div>`,"feed");const box=document.getElementById("feed");posts.forEach(post=>{const p=state.prompts.find(x=>x.id===post.prompt_id);if(!p)return;const liked=(post.likes||[]).includes(state.session);const comments=state.comments.filter(c=>c.post_id===p.id);const n=el(`<div class="card"><div class="muted">${p.owner}</div><strong>${p.title}</strong><pre style="white-space:pre-wrap">${(p.body||"").replace(/[<>]/g,s=>({"<":"<",">":">"}[s]))}</pre><div class="row"><button class="btn sec like">${L.like} ${(post.likes||[]).length}</button><button class="btn sec copy">${L.copy}</button></div><div class="comments"></div><div class="row"><input class="cmt" placeholder="${L.comment}"/><button class="btn sec send">${L.save}</button></div></div>`);n.querySelector(".like").onclick=()=>{post.likes=post.likes||[];if(liked)post.likes=post.likes.filter(x=>x!==state.session);else post.likes.push(state.session);save();viewFeed()};n.querySelector(".copy").onclick=()=>navigator.clipboard.writeText(p.body||"");const cbox=n.querySelector(".comments");comments.forEach(c=>cbox.appendChild(el(`<p><strong>${c.author_username}</strong> — ${c.body}</p>`)));n.querySelector(".send").onclick=()=>{const body=n.querySelector(".cmt").value.trim();if(!body)return;state.comments.push({id:uid(),post_id:p.id,author_username:state.session,body,created_at:Date.now()});save();viewFeed()};box.appendChild(n)})}
function viewSettings(){const L=t();screen(`<h1>${L.settings}</h1><div class="card"><p>${state.session}</p><button class="btn sec" id="pin">${L.changePin}</button><button class="btn" id="out">${L.logout}</button></div>`,"settings");document.getElementById("out").onclick=()=>{state.session=null;save();viewWelcome()};document.getElementById("pin").onclick=async()=>{const a=prompt(L.pin);const b=prompt(L.pin2);if(!/^\d{4}$/.test(a||"")||a!==b)return alert(L.mismatch);state.users[state.session].pin_hash=await hash(state.session+":"+a);save()}}
document.getElementById("tabs").addEventListener("click",e=>{const go=e.target.dataset.go;if(go==="library")viewLibrary();if(go==="feed")viewFeed();if(go==="settings")viewSettings()});
function render(){langbar();if(!state.session)viewWelcome();else viewLibrary()}render();
</script></body></html>
